name: Publication-grade research analysis

on:
  push:
    branches: [main]
    paths:
      - "research/research_pipeline.py"
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/research-analysis.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download freMTPL2 source files
        run: python src/download_data.py

      - name: Run publication-grade research pipeline
        run: python research/research_pipeline.py

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: motor-insurance-research-outputs
          path: research_outputs/
          if-no-files-found: error
          retention-days: 30

      - name: Commit small research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_outputs
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "Add publication-grade research outputs"
            git push
          fi
